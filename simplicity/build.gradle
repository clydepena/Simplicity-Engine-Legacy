task jpackage(type: Exec) {
    group = 'distribution'
    description = 'Packages the application into a native app image or installer using jpackage'
    dependsOn jar

    def packageType = project.hasProperty('jpackageType') ? project.jpackageType : 'app-image'
    def isWindows = System.getProperty('os.name').toLowerCase().contains('windows')
    def outputDir = layout.buildDirectory.dir('jpackage').get().asFile
    def iconFile = file('src/main/resources/images/ICON_MAIN.ico')

    def jpackageLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(23)
    }

    doFirst {
        delete outputDir
        outputDir.mkdirs()

        def javaHome = jpackageLauncher.get().metadata.installationPath.asFile
        def jpackageExe = new File(javaHome, 'bin/jpackage' + (isWindows ? '.exe' : '')).path

        def args = [
                jpackageExe,
                '--type', packageType,
                '--input', jar.destinationDirectory.get().asFile.path,
                '--main-jar', jar.archiveFileName.get(),
                '--main-class', application.mainClass.get(),
                '--name', project.ext.applicationName,
                '--app-version', project.ext.appVersion,
                '--vendor', project.ext.applicationName,
                '--dest', outputDir.path
        ]

        if (isWindows && iconFile.exists()) {
            args += ['--icon', iconFile.path]
        }
        if (packageType in ['msi', 'exe']) {
            args += ['--win-menu', '--win-shortcut']
        }

        commandLine = args
    }
}