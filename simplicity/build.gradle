plugins {
    // id 'java'
    // id 'base'
    id 'application'
    id 'org.graalvm.buildtools.native' version '0.10.6'
}

//group = 'groupid'
version = '1.0-SNAPSHOT'

project.ext.lwjglVersion = "3.3.3"
project.ext.jomlVersion = "1.10.5"
project.ext.lwjglNatives = "natives-windows"
project.ext.imguiVersion = '1.86.11'
project.ext.applicationName = "Simplicity"
project.ext.appVersion = "1.0.0"

graalvmNative {
    toolchainDetection = true
    
    binaries.all {
        // common options
        verbose = false

    }

    binaries.main {
        // options to configure the main binary
        javaLauncher = javaToolchains.launcherFor {
            languageVersion = JavaLanguageVersion.of(23)
            vendor = JvmVendorSpec.matching("Oracle Corporation")
        }
        sharedLibrary = false
        imageName = project.ext.applicationName
        mainClass = 'Main'
        buildArgs.add('-O3') // enables additional compiler optimizations
    }

    binaries.test {
        // options to configure the test binary
        quickBuild = false
        debug = false
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(23)
    }
}

//  compileJava.options.fork = true
//  compileJava.options.forkOptions.executable = 'C:/Program Files/Java/jre1.8.0_441/bin/javacpl'

application {
  // Define the main class for the application.
  mainClass = 'Main'
}

jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes 'Main-Class': application.mainClass
    }
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    // baseName 'Simplicity'
}

